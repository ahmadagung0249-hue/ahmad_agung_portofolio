<!DOCTYPE html>
<html lang="id">
<head>
  <head>
    <base href="/ahmad_agung_portofolio/">
    <meta charset="UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmad Agung | Creative Developer</title>
<style>
  :root {
    --bg: #0A0A0F;
    --bg-secondary: #111118;
    --neon-blue: #00D9FF;
    --neon-purple: #7C3AED;
    --text: #E5E7EB;
    --text-muted: #9CA3AF;
    --card: #15151F;
    --border: rgba(124, 58, 237, 0.2);
    --glow-blue: 0 0 20px rgba(0, 217, 255, 0.5), 0 0 40px rgba(0, 217, 255, 0.3);
    --glow-purple: 0 0 20px rgba(124, 58, 237, 0.5), 0 0 40px rgba(124, 58, 237, 0.3);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 20% 20%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 217, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.05) 0%, transparent 50%);
    animation: bgMove 20s ease-in-out infinite alternate;
    z-index: -1;
    pointer-events: none;
  }

  @keyframes bgMove {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-5%, -5%) rotate(5deg); }
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
  }

  section {
    padding: 100px 0;
    position: relative;
  }

  h1, h2, h3 {
    line-height: 1.2;
    font-weight: 700;
  }

  h2 {
    font-size: 2.5rem;
    margin-bottom: 16px;
    text-align: center;
  }

  .section-subtitle {
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 60px;
    font-size: 1.1rem;
  }

  .glow-text {
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.3));
  }

  /* Navbar */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(10, 10, 15, 0.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
    transition: var(--transition);
  }

  .navbar.scrolled {
    box-shadow: 0 4px 30px rgba(0, 217, 255, 0.1);
  }

  .nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    position: relative;
    transition: var(--transition);
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
    box-shadow: var(--glow-blue);
    transition: width 0.3s ease;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: var(--neon-blue);
  }

  .nav-links a:hover::after,
  .nav-links a.active::after {
    width: 100%;
  }

  .menu-toggle {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
  }

  .menu-toggle svg {
    width: 28px;
    height: 28px;
    stroke: var(--text);
  }

  /* Hero */
  #home {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-top: 80px;
  }

  .hero-content {
    position: relative;
    z-index: 1;
  }

  .hero-name {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 900;
    margin-bottom: 16px;
    position: relative;
  }

  .hero-name::before {
    content: 'Ahmad Agung';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: blur(40px);
    opacity: 0.6;
    z-index: -1;
  }

  .hero-tagline {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    color: var(--text-muted);
    margin-bottom: 40px;
    font-weight: 300;
  }

  .btn-group {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 14px 32px;
    border-radius: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: var(--transition);
    cursor: pointer;
    border: none;
    font-size: 1rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    color: white;
    box-shadow: 0 4px 20px rgba(0, 217, 255, 0.3);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: var(--glow-blue), var(--glow-purple);
  }

  .btn-secondary {
    background: transparent;
    color: var(--neon-blue);
    border: 2px solid var(--neon-blue);
  }

  .btn-secondary:hover {
    background: rgba(0, 217, 255, 0.1);
    box-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
    transform: translateY(-2px);
  }

  /* About */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 60px;
    align-items: center;
  }

  .profile-wrapper {
    position: relative;
    width: 100%;
    max-width: 350px;
    margin: 0 auto;
  }

  .profile-img {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    object-fit: cover;
    position: relative;
    z-index: 1;
    border: 4px solid var(--neon-blue);
    box-shadow: 0 0 30px rgba(0, 217, 255, 0.6), 
                0 0 60px rgba(0, 217, 255, 0.3),
                inset 0 0 20px rgba(0, 217, 255, 0.2);
    transition: var(--transition);
  }

  .profile-img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(0, 217, 255, 0.8), 
                0 0 80px rgba(0, 217, 255, 0.5),
                0 0 120px rgba(124, 58, 237, 0.3);
  }

  .profile-glow {
    position: absolute;
    inset: -30px;
    background: radial-gradient(circle, var(--neon-blue) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.4;
    animation: pulse 3s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.1); }
  }

  .about-text p {
    color: var(--text-muted);
    margin-bottom: 32px;
    font-size: 1.1rem;
  }

  .values-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 40px;
  }

  .value-card {
    background: var(--card);
    padding: 24px;
    border-radius: 16px;
    border: 1px solid var(--border);
    transition: var(--transition);
    text-align: center;
  }

  .value-card:hover {
    border-color: var(--neon-blue);
    box-shadow: 0 0 30px rgba(0, 217, 255, 0.2);
    transform: translateY(-4px);
  }

  .value-card svg {
    width: 40px;
    height: 40px;
    margin-bottom: 12px;
    stroke: var(--neon-blue);
    filter: drop-shadow(0 0 8px rgba(0, 217, 255, 0.5));
  }

  .value-card h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
  }

  .value-card p {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin: 0;
  }

  /* Skills */
  .skills-container {
    max-width: 800px;
    margin: 0 auto;
  }

  .skill-item {
    margin-bottom: 32px;
  }

  .skill-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .skill-bar {
    height: 12px;
    background: var(--bg-secondary);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  .skill-progress {
    height: 100%;
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
    border-radius: 12px;
    position: relative;
    width: 0;
    transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
  }

  .skill-progress::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 100px;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100px); }
    100% { transform: translateX(100px); }
  }

  /* Projects */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 32px;
  }

  .project-card {
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: var(--transition);
    cursor: pointer;
    position: relative;
  }

  .project-card:hover {
    transform: translateY(-8px);
    border-color: var(--neon-blue);
    box-shadow: 0 10px 40px rgba(0, 217, 255, 0.3), 0 0 60px rgba(124, 58, 237, 0.2);
  }

  .project-img-wrapper {
    position: relative;
    width: 100%;
    height: 220px;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }

  .project-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: var(--transition);
  }

  .project-img-wrapper::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 2px solid transparent;
    transition: var(--transition);
    pointer-events: none;
  }

  .project-card:hover .project-img-wrapper::after {
    border-color: var(--neon-blue);
    box-shadow: inset 0 0 30px rgba(0, 217, 255, 0.6), 0 0 30px rgba(0, 217, 255, 0.4);
  }

  .project-card:hover .project-img {
    transform: scale(1.05);
    filter: brightness(1.1);
  }

  .project-content {
    padding: 24px;
  }

  .project-content h3 {
    font-size: 1.4rem;
    margin-bottom: 12px;
  }

  .project-content p {
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .tech-stack {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tech-tag {
    padding: 6px 14px;
    background: rgba(0, 217, 255, 0.1);
    border: 1px solid rgba(0, 217, 255, 0.3);
    border-radius: 20px;
    font-size: 0.85rem;
    color: var(--neon-blue);
  }

  /* Contact */
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .contact-form {
    background: var(--card);
    padding: 40px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .form-group {
    margin-bottom: 24px;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 14px 18px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    transition: var(--transition);
  }

  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--neon-blue);
    box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1), 0 0 20px rgba(0, 217, 255, 0.2);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 120px;
  }

  .contact-info {
    display: flex;
    flex-direction: column;
    gap: 24px;
    justify-content: center;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px;
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    transition: var(--transition);
    text-decoration: none;
    color: var(--text);
    position: relative;
    overflow: hidden;
  }

  .contact-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 0;
  }

  .contact-item:hover::before {
    opacity: 0.1;
  }

  .contact-item:hover {
    border-color: var(--neon-blue);
    box-shadow: 0 0 30px rgba(0, 217, 255, 0.4), 0 0 60px rgba(124, 58, 237, 0.2);
    transform: translateX(8px) scale(1.02);
  }

  .contact-item svg {
    width: 28px;
    height: 28px;
    stroke: var(--neon-purple);
    flex-shrink: 0;
    z-index: 1;
    filter: drop-shadow(0 0 8px rgba(124, 58, 237, 0.6));
    transition: var(--transition);
  }

  .contact-item:hover svg {
    stroke: var(--neon-blue);
    transform: scale(1.1) rotate(5deg);
    filter: drop-shadow(0 0 12px rgba(0, 217, 255, 0.8));
  }

  .contact-item div {
    z-index: 1;
  }

  .contact-item h3 {
    font-size: 1.1rem;
    margin-bottom: 4px;
  }

  .contact-item p {
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  /* Footer */
  footer {
    background: var(--bg-secondary);
    padding: 40px 0;
    text-align: center;
    border-top: 1px solid var(--border);
  }

  footer p {
    color: var(--text-muted);
  }

  /* Back to Top */
  .back-to-top {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: var(--transition);
    z-index: 999;
    box-shadow: var(--glow-blue);
  }

  .back-to-top.visible {
    opacity: 1;
    visibility: visible;
  }

  .back-to-top:hover {
    transform: translateY(-4px);
    box-shadow: var(--glow-blue), var(--glow-purple);
  }

  .back-to-top svg {
    width: 24px;
    height: 24px;
    stroke: white;
  }

  /* Animations */
  .fade-in {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .fade-in.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Responsive */
  @media (max-width: 768px) {
    section {
      padding: 60px 0;
    }

    .nav-links {
      position: fixed;
      top: 70px;
      left: -100%;
      width: 100%;
      background: rgba(10, 10, 15, 0.98);
      backdrop-filter: blur(12px);
      flex-direction: column;
      padding: 40px 24px;
      gap: 24px;
      border-bottom: 1px solid var(--border);
      transition: left 0.3s ease;
    }

    .nav-links.active {
      left: 0;
    }

    .menu-toggle {
      display: block;
    }

    h2 {
      font-size: 2rem;
    }

    .about-grid {
      grid-template-columns: 1fr;
      gap: 40px;
    }

    .values-grid {
      grid-template-columns: 1fr;
    }

    .contact-grid {
      grid-template-columns: 1fr;
      gap: 40px;
    }

    .btn-group {
      flex-direction: column;
    }

    .btn {
      width: 100%;
      justify-content: center;
    }
  }

  @media (max-width: 480px) {
    .projects-grid {
      grid-template-columns: 1fr;
    }

    .contact-form {
      padding: 24px;
    }
  }
</style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#home" class="logo glow-text">AA.</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="#home" class="nav-link active">Home</a></li>

        <li><a href="#skills" class="nav-link">Skills</a></li>
        <li><a href="#projects" class="nav-link">Projects</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <svg fill="none" stroke-width="2" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </nav> 

  <!-- Hero Section -->
  <section id="home">
    <div class="container">
      <div class="hero-content fade-in">
        <h1 class="hero-name glow-text">Ahmad Agung</h1>
        <p class="hero-tagline">Creative Developer</p>

          <a href="#projects" class="btn btn-primary">

          <a href="#contact" class="btn btn-secondary">

            Kontak Saya
          </a>
        </div>
      </div>
    </div>
    </section>

  <!-- About Section -->
  <section id="about">
    <div class="container">
      <h2 class="fade-in">About <span class="glow-text">Me</span></h2>
      <p class="section-subtitle fade-in">Mengenal lebih dekat tentang perjalanan saya</p>
      <div class="about-grid">
